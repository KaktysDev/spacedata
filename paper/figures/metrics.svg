<svg class="fig-svg" id="svg-metrics" viewBox="0 0 640 262" role="img" aria-label="How measured tokens become energy, water and cost" xmlns="http://www.w3.org/2000/svg"><defs><marker id="metrics-ah-fg" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1.2 L10,5 L0,8.8 z" class="fl-fg"/></marker><marker id="metrics-ah-m" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1.2 L10,5 L0,8.8 z" class="fl-m"/></marker><marker id="metrics-ah-orb" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1.2 L10,5 L0,8.8 z" class="fl-orb"/></marker><marker id="metrics-ah-gnd" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1.2 L10,5 L0,8.8 z" class="fl-gnd"/></marker></defs><rect x="10" y="22" width="140" height="64" class="box-orb" rx="6"/><text x="80" y="39" class="tx b mid">Tokens N</text><text x="80" y="53" class="tx s mid">prompt + completion</text><text x="80" y="65" class="tx-m s mid">reported by the provider</text><text x="80" y="77" class="tx-m s mid">(estimated if absent)</text><line x1="150" y1="54" x2="248" y2="54" class="st" marker-end="url(#metrics-ah-fg)"/><text x="199" y="47" class="tx s mid">× e ÷ 3,600</text><text x="199" y="68" class="tx-m xs mid">e = 1.11 J/token</text><rect x="250" y="22" width="140" height="64" class="box" rx="6"/><text x="320" y="39" class="tx b mid">IT energy</text><text x="320" y="53" class="tx s mid">E<tspan dy="3" font-size="72%">IT</tspan><tspan dy="-3">​</tspan> (Wh)</text><text x="320" y="65" class="tx-m s mid">chips, memory, network</text><line x1="390" y1="54" x2="488" y2="54" class="st" marker-end="url(#metrics-ah-fg)"/><text x="439" y="47" class="tx s mid">× PUE</text><text x="439" y="68" class="tx-m xs mid">1.09 · 1.10 · 1.04</text><text x="439" y="78" class="tx-m xs mid">Google · other · orbit</text><rect x="490" y="22" width="140" height="64" class="box" rx="6"/><text x="560" y="39" class="tx b mid">Facility energy</text><text x="560" y="53" class="tx s mid">E = PUE · E<tspan dy="3" font-size="72%">IT</tspan><tspan dy="-3">​</tspan> (Wh)</text><text x="560" y="65" class="tx-m s mid">IT plus cooling and power</text><path d="M530,86 C530,114 405,106 405,126" class="st" marker-end="url(#metrics-ah-fg)"/><line x1="560" y1="86" x2="560" y2="126" class="st" marker-end="url(#metrics-ah-fg)"/><rect x="330" y="128" width="150" height="58" class="box" rx="6"/><text x="405" y="145" class="tx b mid">Cooling water</text><text x="405" y="159" class="tx s mid">W = w · E</text><text x="405" y="171" class="tx-m s mid">w = 1.1 mL/Wh on the ground</text><text x="405" y="183" class="tx-m s mid">w = 0 in orbit (radiators)</text><rect x="490" y="128" width="140" height="58" class="box" rx="6"/><text x="560" y="145" class="tx b mid">Electricity cost</text><text x="560" y="159" class="tx s mid">$ = p · E / 1000</text><text x="560" y="171" class="tx-m s mid">p = $0.045/kWh ground</text><text x="560" y="183" class="tx-m s mid">p = $0.002/kWh orbit</text><text x="10" y="140" class="tx-orb caps">MEASURED</text><text x="84" y="140" class="tx s">token counts N, from each reply</text><text x="10" y="158" class="tx caps">MODELED</text><text x="84" y="158" class="tx s">e, PUE, w and p: fixed published</text><text x="84" y="169" class="tx s">parameters, the same for every query</text><rect x="10" y="208" width="620" height="46" class="box-dash" rx="6"/><text x="22" y="226" class="tx b">Separate lane:</text><text x="100" y="226" class="tx">frozen satellite positions + your pin → route geometry → network round trip (ms).</text><text x="22" y="242" class="tx-m s">Provider call duration is measured and kept with each reply, but it is not shown as a route time.</text></svg>
<svg class="fig-svg" id="svg-system" viewBox="0 0 640 300" role="img" aria-label="One question, two modeled paths and one measured reply source" xmlns="http://www.w3.org/2000/svg"><defs><marker id="system-ah-fg" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1.2 L10,5 L0,8.8 z" class="fl-fg"/></marker><marker id="system-ah-m" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1.2 L10,5 L0,8.8 z" class="fl-m"/></marker><marker id="system-ah-orb" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1.2 L10,5 L0,8.8 z" class="fl-orb"/></marker><marker id="system-ah-gnd" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1.2 L10,5 L0,8.8 z" class="fl-gnd"/></marker></defs><text x="78" y="18" class="tx-gnd caps">GROUND PATH · MODELED</text><text x="78" y="128" class="tx-orb caps">ORBITAL PATH · MODELED</text><path d="M36,122 C30,113 27,109 27,104 A9,9 0 1 1 45,104 C45,109 42,113 36,122 Z" class="fl-fg"/><circle cx="36" cy="104" r="3.4" class="fl-bg"/><text x="36" y="140" class="tx b mid">You</text><text x="36" y="152" class="tx-m s mid">pin anywhere</text><line x1="48" y1="104" x2="72" y2="104" class="st-m" stroke-width="1.2"/><line x1="72" y1="52" x2="72" y2="160" class="st-m" stroke-width="1.2"/><line x1="72" y1="52" x2="190" y2="52" class="st-gnd" stroke-width="1.6" marker-end="url(#system-ah-gnd)" marker-start="url(#system-ah-gnd)"/><text x="131" y="45" class="tx s mid">fiber · great-circle d</text><text x="131" y="64" class="tx-gnd s mid">v = c / 1.35</text><rect x="192" y="30" width="124" height="44" class="box-gnd" rx="6"/><text x="254" y="49" class="tx b mid">Nearest public site</text><text x="254" y="63" class="tx-m s mid">1 of 28 reference sites</text><line x1="316" y1="52" x2="520" y2="52" class="st-f" stroke-dasharray="2 3"/><text x="418" y="46" class="tx-m s mid">New York → Ashburn, VA: d = 350 km</text><text x="528" y="49" class="tx b">RTT<tspan dy="3" font-size="72%">g</tspan><tspan dy="-3">​</tspan> = 2d / v</text><text x="528" y="63" class="tx-gnd s">3.15 ms</text><line x1="72" y1="160" x2="178" y2="160" class="st-orb" stroke-width="1.6" marker-end="url(#system-ah-orb)" marker-start="url(#system-ah-orb)"/><text x="125" y="153" class="tx s mid">RF uplink · ρ</text><text x="125" y="172" class="tx-orb s mid">at c</text><rect x="180" y="138" width="124" height="44" class="box-orb" rx="6"/><g transform="translate(196 160) scale(0.8)"><rect x="-9.5" y="-2.2" width="6" height="4.4" class="fl-orb"/><rect x="3.5" y="-2.2" width="6" height="4.4" class="fl-orb"/><line x1="-3.5" y1="0" x2="3.5" y2="0" class="st-orb" stroke-width="1"/><rect x="-2.6" y="-2.6" width="5.2" height="5.2" class="fl-orb"/></g><text x="250" y="156" class="tx b mid">Backhaul craft</text><text x="250" y="170" class="tx-m s mid">highest elevation</text><line x1="304" y1="160" x2="376" y2="160" class="st-orb" stroke-width="1.6" marker-end="url(#system-ah-orb)" marker-start="url(#system-ah-orb)"/><text x="340" y="153" class="tx s mid">optical · L</text><text x="340" y="172" class="tx-orb s mid">chord or arc, c</text><rect x="378" y="138" width="130" height="44" class="box-orb" rx="6"/><g transform="translate(394 160) scale(0.8)"><rect x="-9.5" y="-2.2" width="6" height="4.4" class="fl-fg"/><rect x="3.5" y="-2.2" width="6" height="4.4" class="fl-fg"/><line x1="-3.5" y1="0" x2="3.5" y2="0" class="st" stroke-width="1"/><rect x="-2.6" y="-2.6" width="5.2" height="5.2" class="fl-fg"/></g><text x="448" y="156" class="tx b mid">Starcloud-2</text><text x="448" y="170" class="tx-m s mid">slot 0 · 725 km</text><text x="528" y="157" class="tx b">RTT<tspan dy="3" font-size="72%">o</tspan><tspan dy="-3">​</tspan> = 2(ρ + L) / c</text><text x="528" y="171" class="tx-orb s">41.4 ms</text><text x="304" y="200" class="tx-m s mid">New York at the epoch: ρ = 1,301 km, L = 4,907 km (straight chord)</text><rect x="20" y="222" width="600" height="66" class="box-dash" rx="7"/><text x="34" y="240" class="tx caps">REPLIES · MEASURED</text><text x="34" y="256" class="tx">One prompt → two parallel, identical calls to the same provider API on Earth</text><text x="34" y="271" class="tx-m s">(same system prompt, same 4,096-token cap). Each call returns reply text, token usage and call duration.</text><text x="34" y="283" class="tx-m s">The results card pairs each reply with its path's modeled network time, energy, water and electricity cost.</text></svg>